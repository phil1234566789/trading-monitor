name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Guard historical OB reaction contracts
        run: npx vitest run test/obReactionHistoricalContract.test.js test/orderBlockReactionVerdict.test.js test/orderBlockInternalFvgs.test.js test/orderBlockReactionRetry.test.js test/orderBlockReactionTerminal.test.js test/chartDebuggerCases.test.js test/chartDebuggerFvgs.test.js test/chartDebuggerP7.test.js test/obReactionGraph.test.js test/orderBlockReaction.test.js test/doubleOrderBlocks.test.js
      - run: npm run build
        env:
          # Supabase anon-Key ist bewusst öffentlich (RLS-Policies sind die eigentliche
          # Absicherung, nicht Geheimhaltung des Keys) — trotzdem als Repo-Secret statt
          # hart codiert, damit er nicht zusätzlich im Klartext im Workflow/Git-Verlauf steht.
          # In GitHub: Settings -> Secrets and variables -> Actions -> New repository secret.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Edge Functions, die Code aus src/ oder _shared/ bündeln, mit derselben Fassung wie der Chart
  # ausrollen. Basis ist der letzte erfolgreiche Lauf, nicht github.event.before: cancel-in-progress
  # bricht Läufe ab, deren Änderungen sonst nie deployt würden.
  edge-functions:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Betroffene Functions bestimmen
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list --workflow deploy.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha // ""')
          echo "Basis: ${base:-keine (erster Lauf)}"
          names=$(node scripts/edgeFunctionsToDeploy.mjs "$base")
          echo "Functions: ${names:-keine}"
          echo "names=$names" >> "$GITHUB_OUTPUT"
      - name: Deployen
        if: steps.list.outputs.names != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo-Secret SUPABASE_ACCESS_TOKEN fehlt. Nicht deployt: ${{ steps.list.outputs.names }}. Token unter supabase.com/dashboard/account/tokens anlegen und in GitHub unter Settings → Secrets and variables → Actions eintragen."
            exit 1
          fi
          npx --yes supabase@2.107.0 functions deploy ${{ steps.list.outputs.names }} --project-ref vkphwtqcvqrkphksproj --use-api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
